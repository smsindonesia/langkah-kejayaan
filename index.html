<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Langkah Kejayaan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-teal-50 via-blue-50 to-indigo-100 py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-teal-500 to-blue-600 rounded-2xl mb-4 shadow-lg">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">Langkah Kejayaan</h1>
            <p class="text-gray-600">Catat ibadah shalat harianmu dengan penuh kesadaran</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl shadow-2xl p-8">
            <div id="formContainer" class="space-y-6">
                <!-- Nama -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Nama</label>
                    <select id="nama" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors" required>
                        <option value="">Pilih Nama</option>
                        <option value="Temy">Temy</option>
                        <option value="Hagi">Hagi</option>
                        <option value="Jaka">Jaka</option>
                        <option value="Rizal">Rizal</option>
                        <option value="Kiki">Kiki</option>
                        <option value="Gilang">Gilang</option>
                        <option value="Viko">Viko</option>
                        <option value="Riswan">Riswan</option>
                    </select>
                </div>

                <!-- Tanggal -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                        Tanggal
                    </label>
                    <input type="date" id="tanggal" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors" required>
                </div>

                <!-- Sholat Wajib -->
                <div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Sholat Wajib (Jam)</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9"></path>
                                </svg>
                                Subuh
                            </label>
                            <input type="time" id="subuh" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                                </svg>
                                Dzuhur
                            </label>
                            <input type="time" id="dzuhur" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"></path>
                                </svg>
                                Ashar
                            </label>
                            <input type="time" id="ashar" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                                </svg>
                                Maghrib
                            </label>
                            <input type="time" id="maghrib" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                <svg class="inline w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                                </svg>
                                Isya
                            </label>
                            <input type="time" id="isya" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors">
                        </div>
                    </div>
                </div>

                <!-- Lainnya -->
                <div>
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">Ibadah Lainnya</h3>
                    <select id="lainnya" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-indigo-500 transition-colors">
                        <option value="">Pilih Ibadah Lainnya (Opsional)</option>
                        <option value="Dhuha">Dhuha</option>
                        <option value="Tahajud">Tahajud</option>
                        <option value="Taubat">Taubat</option>
                        <option value="Istikharah">Istikharah</option>
                    </select>
                </div>

                <!-- Jam -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Jam</label>
                    <input type="time" id="jam" class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-teal-500 transition-colors" required>
                </div>

                <!-- Submit Button -->
                <button id="submitBtn" class="w-full bg-gradient-to-r from-teal-500 to-blue-600 text-white font-semibold py-4 rounded-xl hover:from-teal-600 hover:to-blue-700 transition-all transform hover:scale-105 active:scale-95 shadow-lg">
                    Kirim Catatan
                </button>

                <!-- Status Messages -->
                <div id="successMsg" class="hidden p-4 bg-green-50 border-2 border-green-500 rounded-xl flex items-center gap-3">
                    <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <span class="text-green-700 font-medium">Alhamdulillah, Barakallah🤲</span>
                </div>
                <div id="errorMsg" class="hidden p-4 bg-red-50 border-2 border-red-500 rounded-xl">
                    <span class="text-red-700 font-medium">Terjadi kesalahan. Silakan coba lagi.</span>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-gray-600 text-sm">
            <p>Istiqomah adalah kunci kejayaan 🌟</p>
        </div>
    </div>

    <script>
        // Set tanggal hari ini
        document.getElementById('tanggal').valueAsDate = new Date();

        // Submit handler
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const nama = document.getElementById('nama').value;
            const tanggal = document.getElementById('tanggal').value;
            const jam = document.getElementById('jam').value;

            if (!nama || !tanggal || !jam) {
                alert('Mohon lengkapi Nama, Tanggal, dan Jam Input!');
                return;
            }

            const data = {
                nama: nama,
                tanggal: tanggal,
                subuh: document.getElementById('subuh').value || '-',
                dzuhur: document.getElementById('dzuhur').value || '-',
                ashar: document.getElementById('ashar').value || '-',
                maghrib: document.getElementById('maghrib').value || '-',
                isya: document.getElementById('isya').value || '-',
                lainnya: document.getElementById('lainnya').value || '-',
                jam: jam,
                timestamp: new Date().toISOString()
            };

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'Mengirim...';
            btn.disabled = true;

            try {
                // GANTI URL INI DENGAN WEB APP URL GOOGLE APPS SCRIPT ANDA
                const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyiXtW3Y0ZRpZCe8jzJ6hVoX1iL9FLkEdSHFsxkvaANYOELzcnC06fQ5BbVwaNkZorTmg/exec';
                
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                document.getElementById('successMsg').classList.remove('hidden');
                document.getElementById('errorMsg').classList.add('hidden');

                // Reset form
                document.getElementById('nama').value = '';
                document.getElementById('tanggal').valueAsDate = new Date();
                document.getElementById('subuh').value = '';
                document.getElementById('dzuhur').value = '';
                document.getElementById('ashar').value = '';
                document.getElementById('maghrib').value = '';
                document.getElementById('isya').value = '';
                document.getElementById('lainnya').value = '';
                document.getElementById('jam').value = '';

                setTimeout(() => {
                    document.getElementById('successMsg').classList.add('hidden');
                }, 5000);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('errorMsg').classList.remove('hidden');
                document.getElementById('successMsg').classList.add('hidden');
            } finally {
                btn.textContent = 'Catat Ibadah';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
